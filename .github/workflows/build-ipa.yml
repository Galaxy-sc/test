name: Build Frida test IPA

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: "Frida version to embed (tag name from github.com/frida/frida/releases)"
        required: false
        default: "17.15.3"

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Uncomment to see which Xcode versions the runner has available,
      # and pin one explicitly with `sudo xcode-select -s /Applications/Xcode_XX.app`
      # if the default doesn't work for you.
      # - name: List available Xcodes
      #   run: ls /Applications | grep Xcode

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download Frida Gadget (iOS, universal)
        env:
          FRIDA_VERSION: ${{ github.event.inputs.frida_version || '17.15.3' }}
        run: |
          set -e
          echo "Using Frida $FRIDA_VERSION"
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-ios-universal.dylib.xz"
          echo "Downloading $URL"
          mkdir -p FridaGadget
          curl -fL -o gadget.dylib.xz "$URL"

          # Fail loudly (instead of a confusing unxz error) if GitHub gave us
          # an HTML/JSON error page instead of the actual archive.
          if ! file gadget.dylib.xz | grep -q "XZ compressed data"; then
            echo "::error::Download did not return a valid .xz file. Check that ${FRIDA_VERSION} exists at $URL"
            file gadget.dylib.xz
            cat gadget.dylib.xz
            exit 1
          fi

          unxz gadget.dylib.xz
          mv gadget.dylib FridaGadget/FridaGadget.dylib
          ls -la FridaGadget

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app for a real device
        run: |
          xcodebuild build \
            -project FridaTest.xcodeproj \
            -scheme FridaTest \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/FridaTest.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r FridaTest.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FridaTest-ipa
          path: FridaTest.ipa
