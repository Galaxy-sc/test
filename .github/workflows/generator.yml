name: Generate Secure Certificate

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'GitHub Username'
        required: true
        type: string

jobs:
  build-cert:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Crypto Libraries
        run: pip install PyJWT cryptography

      - name: Process & Sign
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          USER_INPUT: ${{ inputs.username }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          import urllib.request, json, os, sys
          import jwt
          
          user = os.environ['USER_INPUT']
          private_key = os.environ['PRIVATE_KEY']
          
          print(f"[*] بررسی فعالیت‌های کاربر: {user}")
          
          # دریافت داده از گیت‌هاب
          url = f"https://api.github.com/search/issues?q=author:{user}+org:OWASP+type:pr+is:merged"
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          
          with urllib.request.urlopen(req) as response:
              data = json.loads(response.read().decode())
              count = data.get('total_count', 0)
          
          # ---------- حل مشکل 1: جلوگیری از صدور برای افراد با مشارکت 0 ----------
          if count == 0:
              print(f"::error::کاربر {user} هیچ PR مرج شده‌ای در OWASP ندارد. صدور لغو شد!")
              sys.exit(1) # اینجا پروسه رو قطع می‌کنیم
          # ------------------------------------------------------------------------
              
          tier = "Gold" if count >= 5 else "Silver"
          
          # ---------- حل مشکل 2: ساخت توکن امن نامتقارن ----------
          payload = {
              "user": user,
              "tier": tier,
              "pr_count": count
          }
          
          # امضا با کلید خصوصی با استفاده از الگوریتم قدرتمند RS256
          token = jwt.encode(payload, private_key, algorithm="RS256")
          
          final_url = f"https://{os.environ['REPO_OWNER']}.github.io/{os.environ['REPO_NAME']}/?token={token}"
          
          print("="*60)
          print(f"::notice title=✅ مدرک صادر شد!:: {final_url}")
          print("="*60)
        shell: python
