name: Generate test Certificate

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'GitHub Username of the contributor'
        required: true
        type: string

jobs:
  build-certificate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Secure Link
        env:
          SEC: ${{ secrets.CERT_SECRET }}
          USER_INPUT: ${{ inputs.username }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          import urllib.request
          import json
          import hmac
          import hashlib
          import os
          
          user = os.environ['USER_INPUT']
          secret = os.environ.get('SEC', 'owasp_secret_123')
          repo_owner = os.environ['REPO_OWNER']
          repo_name = os.environ['REPO_NAME']
          
          print(f"[*] Fetching OWASP data for: {user}")
          
          # تماس با API گیت هاب
          url = f"https://api.github.com/search/issues?q=author:{user}+org:OWASP+type:pr+is:merged"
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          
          try:
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
                  count = data.get('total_count', 0)
                  print(f"[*] Found {count} merged PRs.")
          except Exception as e:
              print(f"[!] Error fetching data: {e}")
              count = 0
              
          # تعیین سطح مدرک
          tier = "Gold" if count >= 5 else "Silver"
          
          # ساخت امضای دیجیتال
          payload = f"{user}{tier}"
          sig = hmac.new(secret.encode('utf-8'), payload.encode('utf-8'), hashlib.sha256).hexdigest()
          
          # ساخت لینک نهایی
          base_url = f"https://{repo_owner}.github.io/{repo_name}"
          final_url = f"{base_url}/?user={user}&tier={tier}&sig={sig}"
          
          print("\n" + "="*60)
          print(f"::notice title=🎉 Certificate Generated! Click the link below:: {final_url}")
          print("="*60 + "\n")
        shell: python
