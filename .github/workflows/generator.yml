name: Generate Secure Certificate (IssueOps)

on:
  issues:
    types: [opened]

concurrency:
  group: cert-request-${{ github.actor }}
  cancel-in-progress: true

jobs:
  build-cert:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Crypto Libraries
        run: pip install PyJWT cryptography

      - name: Process & Sign
        id: generate
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          USER_INPUT: ${{ github.actor }} 
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          import urllib.request, json, os, sys, jwt, re
          
          user = os.environ['USER_INPUT']
          private_key = os.environ['PRIVATE_KEY']
          issue_body = os.environ['ISSUE_BODY']
          
          issue_title = "${{ github.event.issue.title }}"
          if "Cert Request" not in issue_title:
              sys.exit(0)
              
          name_match = re.search(r'FullName:\s*(.+)', issue_body)
          real_name = name_match.group(1).strip() if name_match else user
              
          url = f"https://api.github.com/search/issues?q=author:{user}+org:OWASP+type:pr+is:merged"
          
          # هدر بدون توکن برای دور زدن محدودیت Scope ربات
          headers = {
              'User-Agent': 'Mozilla/5.0'
          }
          req = urllib.request.Request(url, headers=headers)
          
          try:
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
                  count = data.get('total_count', 0)
          except Exception as e:
              # چاپ دقیق ارور برای دیباگ در صورت وقوع مشکل
              print(f"::error::ارتباط با API گیت‌هاب قطع شد: {e}")
              if hasattr(e, 'read'):
                  print(f"::error::جزئیات خطا: {e.read().decode('utf-8')}")
                  
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write("ERROR_MSG=خطا در ارتباط با سرورهای گیت‌هاب (احتمالاً محدودیت Rate Limit)\n")
              sys.exit(1)
          
          if count == 0:
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write(f"ERROR_MSG=کاربر @{user} هیچ PR مرج شده‌ای در OWASP ندارد.\n")
              sys.exit(1)
              
          tier = "Gold" if count >= 5 else "Silver"
          
          payload = {
              "user": user, 
              "real_name": real_name, 
              "tier": tier, 
              "pr_count": count
          }
          
          token = jwt.encode(payload, private_key, algorithm="RS256")
          if isinstance(token, bytes): token = token.decode('utf-8')
          safe_token = token.encode('utf-8').hex()
          
          final_url = f"https://{os.environ['REPO_OWNER']}.github.io/{os.environ['REPO_NAME']}/?token={safe_token}"
          
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"CERT_URL={final_url}\n")
              f.write(f"TIER={tier}\n")
              f.write(f"COUNT={count}\n")
              f.write(f"REAL_NAME={real_name}\n")
        shell: python

      - name: Comment Success & Close Issue
        if: success() && env.CERT_URL != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment $ISSUE --body "### 🎉 تبریک! مدرک شما آماده است.
          **نام ثبت شده:** ${{ env.REAL_NAME }}
          **سطح:** ${{ env.TIER }} (${{ env.COUNT }} مشارکت)
          
          🔗 [**>> برای مشاهده و دریافت مدرک کلیک کنید <<**](${{ env.CERT_URL }})"
          gh issue close $ISSUE --reason "completed"

      - name: Comment Failure & Close Issue
        if: failure() && env.ERROR_MSG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment $ISSUE --body "❌ **صدور مدرک با خطا مواجه شد:**
          ${{ env.ERROR_MSG }}"
          gh issue close $ISSUE --reason "not planned"
