name: Generate Secure Certificate (IssueOps)

on:
  issues:
    types: [opened]

jobs:
  build-cert:
    runs-on: ubuntu-latest
    # این پرمیشن برای کامنت گذاشتن ربات الزامی است
    permissions:
      issues: write
    
    steps:
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Crypto Libraries
        run: pip install PyJWT cryptography

      - name: Process & Sign
        id: generate
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          # اینجا یوزرنیم کسی که Issue را باز کرده می‌گیریم (امنیت ۱۰۰٪)
          USER_INPUT: ${{ github.actor }} 
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          import urllib.request, json, os, sys, jwt
          
          user = os.environ['USER_INPUT']
          private_key = os.environ['PRIVATE_KEY']
          
          # فقط issue هایی که عنوانشون Cert Request هست رو پردازش کن
          issue_title = "${{ github.event.issue.title }}"
          if "Cert Request" not in issue_title:
              sys.exit(0)
              
          url = f"https://api.github.com/search/issues?q=author:{user}+org:OWASP+type:pr+is:merged"
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          
          try:
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
                  count = data.get('total_count', 0)
          except Exception as e:
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write("ERROR_MSG=خطا در ارتباط با سرورهای گیت‌هاب\n")
              sys.exit(1)
          
          if count == 0:
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write(f"ERROR_MSG=کاربر @{user} هیچ PR مرج شده‌ای در OWASP ندارد.\n")
              sys.exit(1)
              
          tier = "Gold" if count >= 5 else "Silver"
          payload = {"user": user, "tier": tier, "pr_count": count}
          
          token = jwt.encode(payload, private_key, algorithm="RS256")
          if isinstance(token, bytes): token = token.decode('utf-8')
          safe_token = token.encode('utf-8').hex()
          
          final_url = f"https://{os.environ['REPO_OWNER']}.github.io/{os.environ['REPO_NAME']}/?token={safe_token}"
          
          # انتقال لینک به مرحله بعد برای کامنت گذاشتن
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"CERT_URL={final_url}\n")
              f.write(f"TIER={tier}\n")
              f.write(f"COUNT={count}\n")
        shell: python

      - name: Comment Success & Close Issue
        if: success() && env.CERT_URL != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment $ISSUE --body "### 🎉 تبریک! مدرک شما آماده است.
          **سطح:** ${{ env.TIER }} (${{ env.COUNT }} مشارکت)
          
          🔗 [**>> برای مشاهده و دریافت مدرک کلیک کنید <<**](${{ env.CERT_URL }})"
          gh issue close $ISSUE --reason "completed"

      - name: Comment Failure & Close Issue
        if: failure() && env.ERROR_MSG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment $ISSUE --body "❌ **صدور مدرک با خطا مواجه شد:**
          ${{ env.ERROR_MSG }}"
          gh issue close $ISSUE --reason "not planned"
