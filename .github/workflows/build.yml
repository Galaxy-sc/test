name: Build Vuln Lab IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          brew install xcodegen ldid
          # ایجاد پروژه
          cat <<EOF > project.yml
          name: VulnApp
          targets:
            VulnApp:
              type: application
              platform: iOS
              deploymentTarget: "14.0"
              sources: [App.swift]
          EOF
          xcodegen
          # بیلد کردن
          xcodebuild build -scheme VulnApp -sdk iphoneos -configuration Release SYMROOT=$(PWD)/build CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          # ساخت پکیج
          mkdir -p build/Payload
          mv build/Release-iphoneos/VulnApp.app build/Payload/
          ldid -S build/Payload/VulnApp.app/VulnApp
          cd build && zip -qr VulnApp.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VulnApp-IPA
          path: build/VulnApp.ipa
