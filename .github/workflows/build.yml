name: Build Vuln Lab IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          brew install xcodegen ldid

          # 1. افزودن مسیر Info.plist به کانفیگ پروژه (بسیار مهم)
          cat <<EOF > project.yml
          name: VulnApp
          targets:
            VulnApp:
              type: application
              platform: iOS
              deploymentTarget: "14.0"
              sources: [App.swift]
              info:
                path: Info.plist
              settings:
                CODE_SIGNING_ALLOWED: NO
                CODE_SIGNING_REQUIRED: NO
                CODE_SIGN_IDENTITY: ""
                TARGETED_DEVICE_FAMILY: "1"
          EOF

          xcodegen

          # 2. اضافه کردن پرچم‌های لازم برای بیلد بدون ساین در iOS
          xcodebuild build \
            -project VulnApp.xcodeproj \
            -scheme VulnApp \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT=$(PWD)/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            VALIDATE_WORKSPACE=NO

          # 3. ساختار صحیح پوشه Payload
          mkdir -p build/Payload
          cp -R build/Release-iphoneos/VulnApp.app build/Payload/

          # اعمال امضای جعلی (Pseudo-sign) با ldid
          ldid -S build/Payload/VulnApp.app/VulnApp

          cd build && zip -qr VulnApp.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: VulnApp-IPA
          path: build/VulnApp.ipa
