name: Build Vulnerable iOS App with Frida

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Package IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Extract Frida Gadget
        run: |
          curl -L -o frida-gadget.dylib.xz https://github.com/frida/frida/releases/download/17.15.3/frida-gadget-17.15.3-ios-universal.dylib.xz
          xz -d frida-gadget.dylib.xz
          
          # تبدیل فایل لخت به یک فریم‌ورک استاندارد
          mkdir -p FridaGadget.framework
          mv frida-gadget.dylib FridaGadget.framework/FridaGadget
          
          # ساخت شناسنامه (Info.plist) برای فریم‌ورک
          cat <<EOF > FridaGadget.framework/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>FridaGadget</string>
              <key>CFBundleIdentifier</key>
              <string>re.frida.Gadget</string>
              <key>CFBundlePackageType</key>
              <string>FMWK</string>
              <key>CFBundleShortVersionString</key>
              <string>17.15.3</string>
          </dict>
          </plist>
          EOF
          
          # 🌟 ساخت فایل کانفیگ برای دور زدن محدودیت‌های iOS 26
          cat <<EOF > FridaGadget.framework/FridaGadget.config
          {
            "interaction": {
              "type": "listen",
              "address": "127.0.0.1",
              "port": 27042,
              "on_port_conflict": "pick-next",
              "on_load": "wait"
            },
            "code_signing": "required"
          }
          EOF
          
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned App
        run: |
          xcodebuild clean build \
            -project VulnerableApp.xcodeproj \
            -scheme VulnerableApp \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT=$PWD/build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/VulnerableApp.app Payload/
          zip -r VulnerableApp.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VulnerableApp-IPA
          path: VulnerableApp.ipa
