name: Build Vulnerable iOS App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Package IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned App
        run: |
          xcodebuild clean build \
            -project VulnerableApp.xcodeproj \
            -scheme VulnerableApp \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT=$PWD/build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/VulnerableApp.app Payload/
          zip -r VulnerableApp.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VulnerableApp-IPA
          path: VulnerableApp.ipa
