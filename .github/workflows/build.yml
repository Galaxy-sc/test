name: Build Vulnerable iOS App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Package IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Unsigned App
        # کامند زیر اپلیکیشن را بدون نیاز به Certificate و Provisioning Profile بیلد می‌کند
        run: |
          xcodebuild clean build \
            -project VulnerableApp.xcodeproj \
            -scheme VulnerableApp \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT=$PWD/build

      - name: Package into IPA
        # ساخت پوشه Payload و تبدیل فایل .app به .ipa
        run: |
          mkdir -p Payload
          # مسیر زیر ممکن است بر اساس نام پروژه شما کمی متفاوت باشد
          cp -r build/Release-iphoneos/VulnerableApp.app Payload/
          zip -r VulnerableApp.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VulnerableApp-IPA
          path: VulnerableApp.ipa
