<script>
        // کلید عمومی شما در اینجا قرار دارد...
        const PUBLIC_KEY = `-----BEGIN PUBLIC KEY-----
MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAoEQfLkoDz9yg0jXxDfBu
GXqskmCW3/ag6n8PxqDoHr6kvwjMR/sSl5/lOQEkFizEfCZSlwRQayuEyuSODKCg
4rhv0jbb3D1Yl0L/3z2dMp3wfkvkQChIn0cLAjdmP/q/pj6kI08XwGF8ZBbbrqAA
YedoYpTw2LshYHPA2R5y59Ek7/4QXMcbqd/sGJ8R3XT7hHUXZ8IfP1NEkrUr1jsZ
CB9FFjJ40fokheuGOqi7lZiK0YpdPjTbV7Sm7LGHGMI3qffegup+3WFw0PSVwMnZ
qIfjbmearnc1q/NomLL0yOEDpTcvJ67Bbl3OjKSJQSGz6h0fHo+/Wr52asikibWY
8wIDAQAB
-----END PUBLIC KEY-----`;

        const params = new URLSearchParams(window.location.search);
        let token = params.get('token'); // از let استفاده کردیم تا بتونیم تغییرش بدیم

        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';

            if (token) {
                // دی‌کد کردن توکن (تبدیل ~ به . برای رفع Obfuscation)
                token = token.replace(/~/g, '.');
                
                try {
                    const isValid = KJUR.jws.JWS.verifyJWT(token, PUBLIC_KEY, {alg: ['RS256']});
                    
                    if (isValid) {
                        const base64Url = token.split('.')[1];
                        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                        const payload = JSON.parse(decodeURIComponent(window.atob(base64).split('').map(function(c) {
                            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                        }).join('')));

                        document.getElementById('cert-display').classList.remove('hidden');
                        document.getElementById('user-name').innerText = payload.user;
                        
                        const tierEl = document.getElementById('tier-text');
                        tierEl.innerText = payload.tier + " TIER";
                        tierEl.className = payload.tier === "Gold" ? "text-yellow-600 font-bold text-3xl" : "text-gray-500 font-bold text-3xl";
                    } else {
                        showError("❌ امضا نامعتبر است! این مدرک جعل شده است.");
                    }
                } catch (e) {
                    showError("❌ ساختار لینک دستکاری شده است.");
                }
            } else {
                showError("⚠️ لطفا لینک معتبر را وارد کنید.");
            }
        }, 800);

        function showError(msg) {
            const err = document.getElementById('error-display');
            err.innerHTML = `<h3 class='text-2xl font-bold'>${msg}</h3>`;
            err.classList.remove('hidden');
        }
    </script>
