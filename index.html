<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OWASP Secure Certificate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- اضافه کردن کتابخانه استاندارد برای بررسی امضای نامتقارن -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsrsasign/10.9.0/jsrsasign-all-min.js"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen">

    <div id="cert-display" class="hidden bg-white text-gray-900 p-10 rounded-lg border-[10px] border-blue-900 text-center max-w-2xl w-full">
        <h1 class="text-4xl font-black mb-6">OWASP Certificate</h1>
        <h2 id="user-name" class="text-5xl font-serif text-blue-800 my-4">User</h2>
        <p class="text-lg mb-6">Has successfully contributed to OWASP.</p>
        <p id="tier-text" class="text-3xl font-bold uppercase"></p>
    </div>

    <div id="error-display" class="hidden text-red-500 text-xl font-bold mt-4"></div>

    <script>
        // کلید عمومی خودت را دقیقاً با حفظ فرمت و فاصله‌ها اینجا پیست کن
        const PUBLIC_KEY = `-----BEGIN PUBLIC KEY-----
MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAoEQfLkoDz9yg0jXxDfBu
GXqskmCW3/ag6n8PxqDoHr6kvwjMR/sSl5/lOQEkFizEfCZSlwRQayuEyuSODKCg
4rhv0jbb3D1Yl0L/3z2dMp3wfkvkQChIn0cLAjdmP/q/pj6kI08XwGF8ZBbbrqAA
YedoYpTw2LshYHPA2R5y59Ek7/4QXMcbqd/sGJ8R3XT7hHUXZ8IfP1NEkrUr1jsZ
CB9FFjJ40fokheuGOqi7lZiK0YpdPjTbV7Sm7LGHGMI3qffegup+3WFw0PSVwMnZ
qIfjbmearnc1q/NomLL0yOEDpTcvJ67Bbl3OjKSJQSGz6h0fHo+/Wr52asikibWY
8wIDAQAB
-----END PUBLIC KEY-----`;

        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (token) {
            try {
                // بررسی صحت امضا توسط کلید عمومی (امضای RS256)
                const isValid = KJUR.jws.JWS.verifyJWT(token, PUBLIC_KEY, {alg: ['RS256']});
                
                if (isValid) {
                    // رمزگشایی اطلاعات داخل توکن
                    const base64Url = token.split('.')[1];
                    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                    const payload = JSON.parse(decodeURIComponent(window.atob(base64).split('').map(function(c) {
                        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                    }).join('')));

                    document.getElementById('cert-display').classList.remove('hidden');
                    document.getElementById('user-name').innerText = payload.user;
                    
                    const tierEl = document.getElementById('tier-text');
                    tierEl.innerText = payload.tier + " TIER";
                    tierEl.className = payload.tier === "Gold" ? "text-yellow-600 font-bold text-3xl" : "text-gray-500 font-bold text-3xl";
                } else {
                    showError("❌ امضا نامعتبر است! این مدرک جعل شده است.");
                }
            } catch (e) {
                showError("❌ ساختار لینک دستکاری شده است.");
            }
        } else {
            showError("⚠️ لطفا لینک معتبر را وارد کنید.");
        }

        function showError(msg) {
            const err = document.getElementById('error-display');
            err.innerText = msg;
            err.classList.remove('hidden');
        }
    </script>
</body>
</html>
