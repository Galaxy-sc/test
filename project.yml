name: VulnerableApp
options:
  bundleIdPrefix: com.security
targets:
  VulnerableApp:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - Sources
    dependencies:
      - framework: FridaGadget.framework
        embed: true
        link: false   # 🌟 این خط طلایی جلوی کرش dyld را می‌گیرد
    info:
      path: Info.plist
    settings:
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
