name: VulnApp
options:
  bundleIdPrefix: com.witcher
targets:
  VulnApp:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - App.swift
    info:
      path: Info.plist
    settings:
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      TARGETED_DEVICE_FAMILY: "1"
      INFOPLIST_FILE: Info.plist
      
